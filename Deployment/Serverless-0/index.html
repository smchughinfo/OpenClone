<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClone - AI Clone Service</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
        }
        
        #scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .title {
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 2rem;
            text-align: center;
            letter-spacing: -0.02em;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
        }
        
        .subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 3rem;
            text-align: center;
            letter-spacing: 0.05em;
        }
        
        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
            position: relative;
            animation-duration: 2s;
            animation-iteration-count: infinite;
        }
        
        .status-indicator.checking {
            background: #f59e0b;
            animation-name: pulse-orange;
        }
        
        .status-indicator.online {
            background: #10b981;
            animation-name: pulse-green;
        }
        
        .status-indicator.offline {
            background: #ef4444;
            animation-name: pulse-red;
        }
        
        @keyframes pulse-orange {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            50% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
        }
        
        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
        }
        
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
        }
        
        .status-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .countdown-container {
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .countdown-container.visible {
            opacity: 1;
        }
        
        .countdown-text {
            font-size: 1.2rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 1rem;
        }
        
        .countdown-number {
            font-size: 3rem;
            font-weight: 700;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }
        
        #offlineButtons {
            pointer-events: all;
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 60px; /* Reserve space for buttons */
        }
        
        #offlineButtons.hidden {
            display: flex;
            visibility: hidden;
        }
        
        .fallback-link {
            padding: 0 24px;
            font-size: 16px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .fallback-link:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.5);
        }
        
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        
        .video-modal-content {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            max-width: 800px;
            width: 90%;
            max-height: 90%;
            overflow: hidden;
        }
        
        .video-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        }
        
        .video-modal-header h3 {
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 2rem;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .video-modal-body {
            padding: 20px;
        }
        
        .ratio {
            position: relative;
            width: 100%;
        }
        
        .ratio-16x9 {
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
        }
        
        .ratio iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }
        
        .debug-controls {
        display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            padding: 20px;
            min-width: 250px;
            font-family: 'Inter', sans-serif;
            backdrop-filter: blur(10px);
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .control-group input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(56, 189, 248, 0.2);
            outline: none;
            -webkit-appearance: none;
        }
        
        .control-group input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        
        .control-group input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        
        .control-group .value {
            display: inline-block;
            float: right;
            color: #38bdf8;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: -20px;
        }
        
        @media (max-width: 768px) {
            .ui-overlay {
                padding: 2rem;
            }
            
            .debug-controls {
                top: 10px;
                right: 10px;
                min-width: 200px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="scene"></div>
    
    <div class="ui-overlay">
        <h1 class="title">OpenClone</h1>
        <p class="subtitle">AI Clone Service</p>
        
        <div class="status-container">
            <div id="statusIndicator" class="status-indicator checking"></div>
            <span id="statusText" class="status-text">Checking server status...</span>
        </div>
        
        <div id="countdownContainer" class="countdown-container">
            <p class="countdown-text">Redirecting in</p>
            <div id="countdownNumber" class="countdown-number">5</div>
        </div>
        
        <div id="offlineButtons" class="hidden">
            <button id="tutorialBtn" class="fallback-link" onclick="showVideo()">
                Watch Tutorial Video
            </button>
            <button id="fallbackBtn" class="fallback-link" onclick="window.open('https://app.clonezone.me', '_blank')">
                Try Connecting Anyway
            </button>
        </div>
        
        <!-- Invisible spacer to maintain layout when countdown is hidden -->
        <div id="countdownSpacer" style="display: none;">
            <p class="countdown-text" style="visibility: hidden;">Redirecting in</p>
            <div class="countdown-number" style="visibility: hidden;">5</div>
        </div>
    </div>
    
    <!-- Video Modal -->
    <div id="videoModal" class="video-modal">
        <div class="video-modal-content">
            <div class="video-modal-header">
                <h3>OpenClone Tutorial</h3>
                <button id="closeVideoModal" class="close-btn">&times;</button>
            </div>
            <div class="video-modal-body">
                <div class="ratio ratio-16x9">
                    <iframe id="tutorialIframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Debug Controls -->
    <div class="debug-controls">
        <div class="control-group">
            <label>Galaxy Rotation Speed</label>
            <input type="range" id="galaxySpeed" min="0" max="0.02" step="0.001" value="0.003">
            <span class="value" id="galaxySpeedValue">0.003</span>
        </div>
        <div class="control-group">
            <label>Orbit Radius</label>
            <input type="range" id="orbitRadius" min="1" max="15" step="0.5" value="2">
            <span class="value" id="orbitRadiusValue">2</span>
        </div>
        <div class="control-group">
            <label>Orbit Speed</label>
            <input type="range" id="orbitSpeed" min="1" max="20" step="0.5" value="8">
            <span class="value" id="orbitSpeedValue">8</span>
        </div>
        <div class="control-group">
            <label>Spawn Frequency</label>
            <input type="range" id="spawnFreq" min="10" max="60" step="5" value="30">
            <span class="value" id="spawnFreqValue">30</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Three.js Scene Setup
        let scene, camera, renderer;
        let particles = [];
        let geometries = [];
        let isOnline = false;
        let animationId;
        let greenTransitionValue = 0.0;
        let countdownStartTime = null;
        
        // Load from localStorage or use defaults
        let controls = {
            galaxySpeed: parseFloat(localStorage.getItem('galaxySpeed')) || 0.003,
            orbitRadius: parseFloat(localStorage.getItem('orbitRadius')) || 2,
            orbitSpeed: parseFloat(localStorage.getItem('orbitSpeed')) || 8,
            spawnFreq: parseFloat(localStorage.getItem('spawnFreq')) || 30
        };
        
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 1);
            document.getElementById('scene').appendChild(renderer.domElement);
            
            camera.position.z = 50;
            
            createParticleSystem();
            createGeometryParticles();
            animate();
        }
        
        function createParticleSystem() {
            const particleCount = 1000;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                
                // Position
                positions[i3] = (Math.random() - 0.5) * 200;
                positions[i3 + 1] = (Math.random() - 0.5) * 200;
                positions[i3 + 2] = (Math.random() - 0.5) * 200;
                
                // Color (blue/teal theme)
                colors[i3] = 0.2 + Math.random() * 0.3;     // R
                colors[i3 + 1] = 0.6 + Math.random() * 0.4; // G
                colors[i3 + 2] = 0.8 + Math.random() * 0.2; // B
                
                // Size
                sizes[i] = Math.random() * 3 + 1;
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    online: { value: 0.0 },
                    greenTransition: { value: 0.0 }
                },
                vertexShader: `
                    attribute float size;
                    attribute vec3 customColor;
                    varying vec3 vColor;
                    uniform float time;
                    uniform float online;
                    uniform float greenTransition;
                    
                    void main() {
                        vColor = customColor;
                        
                        vec3 pos = position;
                        
                        // Create clone/echo effect
                        float wave = sin(time * 2.0 + length(pos) * 0.1) * 0.5 + 0.5;
                        pos.x += sin(time + pos.y * 0.01) * 5.0 * wave;
                        pos.y += cos(time + pos.x * 0.01) * 5.0 * wave;
                        
                        // Multiply/duplicate effect
                        float mult = 1.0 + sin(time * 3.0 + length(pos) * 0.05) * 0.2;
                        pos *= mult;
                        
                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        gl_Position = projectionMatrix * mvPosition;
                        
                        float sizeMultiplier = online > 0.5 ? 1.5 : 1.0;
                        gl_PointSize = size * sizeMultiplier * (300.0 / -mvPosition.z);
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    uniform float online;
                    uniform float greenTransition;
                    
                    void main() {
                        vec2 center = gl_PointCoord - 0.5;
                        float dist = length(center);
                        
                        if (dist > 0.5) discard;
                        
                        float alpha = 1.0 - dist * 2.0;
                        vec3 finalColor = vColor;
                        
                        // Gradual color shift to green using greenTransition
                        if (online > 0.5) {
                            vec3 greenColor = vec3(0.2, 1.0, 0.6);
                            finalColor = mix(vColor, greenColor, greenTransition * 0.8);
                        }
                        
                        gl_FragColor = vec4(finalColor, alpha * 0.8);
                    }
                `,
                transparent: true
            });
            
            const particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            particles.push(particleSystem);
        }
        
        function createGeometryParticles() {
            const particleCount = 2000;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const velocities = new Float32Array(particleCount * 3);
            const lifetimes = new Float32Array(particleCount);
            const cloneTimers = new Float32Array(particleCount);
            
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                
                // Position
                positions[i3] = (Math.random() - 0.5) * 120;
                positions[i3 + 1] = (Math.random() - 0.5) * 120;
                positions[i3 + 2] = (Math.random() - 0.5) * 120;
                
                // Color (blue/teal theme)
                colors[i3] = 0.1 + Math.random() * 0.4;     // R
                colors[i3 + 1] = 0.5 + Math.random() * 0.4; // G
                colors[i3 + 2] = 0.7 + Math.random() * 0.3; // B
                
                // Size
                sizes[i] = Math.random() * 4 + 2;
                
                // Velocity
                velocities[i3] = (Math.random() - 0.5) * 0.02;
                velocities[i3 + 1] = (Math.random() - 0.5) * 0.02;
                velocities[i3 + 2] = (Math.random() - 0.5) * 0.02;
                
                // Lifetime and clone timer
                lifetimes[i] = Math.random() * 1000 + 500; // 8-25 seconds at 60fps
                cloneTimers[i] = Math.random() * 300 + 180; // Clone every 3-8 seconds
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('particleColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
            geometry.setAttribute('lifetime', new THREE.BufferAttribute(lifetimes, 1));
            geometry.setAttribute('cloneTimer', new THREE.BufferAttribute(cloneTimers, 1));
            
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    online: { value: 0.0 },
                    greenTransition: { value: 0.0 },
                    orbitRadius: { value: controls.orbitRadius },
                    orbitSpeed: { value: controls.orbitSpeed },
                    spawnFreq: { value: controls.spawnFreq }
                },
                vertexShader: `
                    attribute float size;
                    attribute vec3 particleColor;
                    attribute vec3 velocity;
                    attribute float lifetime;
                    attribute float cloneTimer;
                    varying vec3 vColor;
                    varying float vLifetime;
                    varying float vCloneIntensity;
                    uniform float time;
                    uniform float online;
                    uniform float greenTransition;
                    uniform float orbitRadius;
                    uniform float orbitSpeed;
                    uniform float spawnFreq;
                    
                    void main() {
                        vColor = particleColor;
                        vLifetime = lifetime;
                        
                        vec3 pos = position;
                        
                        // Apply velocity over time
                        pos += velocity * time * 10.0;
                        
                        // Swarm behavior - particles attract to nearby particles
                        float swarmForce = sin(time * 2.0 + length(pos) * 0.05) * 0.3;
                        pos.x += sin(time * 1.5 + pos.y * 0.02) * swarmForce;
                        pos.y += cos(time * 2.0 + pos.x * 0.02) * swarmForce;
                        pos.z += sin(time * 1.8 + pos.x * pos.y * 0.001) * swarmForce;
                        
                        // Orbital clone spawning effect - make it much more frequent and visible
                        float clonePhase = mod(time * spawnFreq * 0.1, 100.0); // Much faster cycling
                        float cloneIntensity = smoothstep(0.0, 20.0, clonePhase) * smoothstep(80.0, 20.0, clonePhase);
                        
                        // Create orbital spawns that orbit around the parent
                        // Also make some particles always spawn based on position hash
                        float alwaysSpawn = step(0.9, fract(sin(dot(position.xy, vec2(12.9898, 78.233))) * 43758.5453));
                        if (cloneIntensity > 0.05 || alwaysSpawn > 0.5) {
                            // Use position hash to create unique behavior per particle
                            float hash = fract(sin(dot(position.xy, vec2(12.9898, 78.233))) * 43758.5453);
                            float hash2 = fract(sin(dot(position.xz, vec2(39.346, 11.135))) * 22578.1459);
                            
                            // Create orbital motion with dynamic parameters
                            float dynamicRadius = orbitRadius + hash * orbitRadius; // Base + variation
                            float dynamicSpeed = orbitSpeed + hash2 * orbitSpeed * 0.5;  // Base + variation
                            float angle = time * dynamicSpeed + hash * 6.28318;
                            
                            // Split into two orbital spawns
                            float splitFactor = step(0.5, hash2); // 50/50 split
                            float finalAngle = angle + splitFactor * 3.14159; // 180 degrees apart
                            
                            vec3 orbitOffset = vec3(
                                cos(finalAngle) * dynamicRadius * cloneIntensity,
                                sin(finalAngle) * dynamicRadius * cloneIntensity * 0.7,
                                sin(finalAngle * 1.3) * dynamicRadius * cloneIntensity * 0.5
                            );
                            
                            pos += orbitOffset;
                        }
                        
                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        gl_Position = projectionMatrix * mvPosition;
                        
                        // Size multiplier when online and when cloning
                        float sizeMultiplier = online > 0.5 ? 1.8 : 1.0;
                        
                        // Make spawns 5x bigger and ensure we pass intensity
                        if (cloneIntensity > 0.05 || alwaysSpawn > 0.5) {
                            sizeMultiplier *= 5.0;
                            vCloneIntensity = max(cloneIntensity, alwaysSpawn);
                        } else {
                            vCloneIntensity = 0.0;
                        }
                        
                        gl_PointSize = size * sizeMultiplier * (200.0 / -mvPosition.z);
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying float vLifetime;
                    varying float vCloneIntensity;
                    uniform float time;
                    uniform float online;
                    uniform float greenTransition;
                    
                    void main() {
                        // Create geometric shapes instead of circles
                        vec2 center = gl_PointCoord - 0.5;
                        float dist = length(center);
                        
                        // Create diamond/square shape
                        float shape = max(abs(center.x), abs(center.y));
                        if (shape > 0.4) discard;
                        
                        float alpha = 1.0 - shape * 2.5;
                        vec3 finalColor = vColor;
                        
                        // Make spawning particles red and throb green
                        if (vCloneIntensity > 0.1) {
                            // Base color is red for spawning particles
                            finalColor = vec3(1.0, 0.0, 0.0);
                            
                            // Green throbbing effect (1x-3x intensity)
                            float throb = 1.0 + 2.0 * (sin(time * 8.0) * 0.5 + 0.5); // 1x to 3x
                            vec3 greenThrob = vec3(0.0, 1.0, 0.0) * throb * vCloneIntensity;
                            finalColor = mix(finalColor, greenThrob, 0.7);
                        }
                        // Gradual color shift when online - more green (for non-spawning particles)
                        else if (online > 0.5) {
                            vec3 greenColor = vec3(0.2, 0.9, 0.4);
                            finalColor = mix(vColor, greenColor, greenTransition * 0.7);
                        }
                        
                        // Add pulsing effect
                        float pulse = sin(time * 4.0 + gl_FragCoord.x * 0.1 + gl_FragCoord.y * 0.1) * 0.1 + 0.9;
                        
                        gl_FragColor = vec4(finalColor * pulse, alpha * 0.6);
                    }
                `,
                transparent: true
            });
            
            const particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            geometries.push(particleSystem);
        }
        
        function animate() {
            animationId = requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;
            
            // Update green transition during countdown
            if (countdownStartTime !== null) {
                const elapsed = (Date.now() - countdownStartTime) / 1000; // seconds
                greenTransitionValue = Math.min(elapsed / 5.0, 1.0); // 0 to 1 over 5 seconds
            }

            // Update particles
            particles.forEach(system => {
                system.material.uniforms.time.value = time;
                system.material.uniforms.online.value = isOnline ? 1.0 : 0.0;
                system.material.uniforms.greenTransition.value = greenTransitionValue;
                system.rotation.y = time * 0.05;
            });

            // Update geometry particle system
            geometries.forEach(system => {
                if (system.material.uniforms) {
                    system.material.uniforms.time.value = time;
                    system.material.uniforms.online.value = isOnline ? 1.0 : 0.0;
                    system.material.uniforms.greenTransition.value = greenTransitionValue;
                    system.material.uniforms.orbitRadius.value = controls.orbitRadius;
                    system.material.uniforms.orbitSpeed.value = controls.orbitSpeed;
                    system.material.uniforms.spawnFreq.value = controls.spawnFreq;
                    
                    // Dynamic galaxy rotation
                    system.rotation.y = time * controls.galaxySpeed;
                    system.rotation.x = Math.sin(time * controls.galaxySpeed * 5) * controls.galaxySpeed * 10;
                }
            });
            
            // Camera movement
            camera.position.x = Math.sin(time * 0.1) * 5;
            camera.position.y = Math.cos(time * 0.15) * 3;
            camera.lookAt(0, 0, 0);
            
            renderer.render(scene, camera);
        }
        
        // Server Status Check - use health endpoint
        async function checkServer() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                
                const response = await fetch('https://app.clonezone.me/api/health', {
                    method: 'HEAD',
                    mode: 'cors',
                    signal: controller.signal,
                    cache: 'no-cache'
                });
                clearTimeout(timeoutId);
                return response.ok;
            } catch (error) {
                return false;
            }
        }
        
        async function updateStatus() {
            const statusIndicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            const countdownContainer = document.getElementById('countdownContainer');
            const fallbackLink = document.getElementById('fallbackLink');
            
            statusIndicator.className = 'status-indicator checking';
            statusText.textContent = 'Checking server status...';
            
            const serverOnline = await checkServer();
            isOnline = serverOnline;
            
            if (serverOnline) {
                statusIndicator.className = 'status-indicator online';
                statusText.textContent = 'Server Online';
                countdownContainer.classList.add('visible');
                
                // Start the green transition
                countdownStartTime = Date.now();
                
                // Start countdown
                let countdown = 5;
                const countdownElement = document.getElementById('countdownNumber');
                
                const countdownInterval = setInterval(() => {
                    countdown--;
                    countdownElement.textContent = countdown;
                    
                    if (countdown <= 0) {
                        clearInterval(countdownInterval);
                        window.location.href = 'https://app.clonezone.me';
                    }
                }, 1000);
                
            } else {
                statusIndicator.className = 'status-indicator offline';
                statusText.textContent = 'Server Offline';
                
                // Hide countdown container and show spacer to maintain layout
                countdownContainer.style.display = 'none';
                const countdownSpacer = document.getElementById('countdownSpacer');
                countdownSpacer.style.display = 'block';
                
                const offlineButtons = document.getElementById('offlineButtons');
                offlineButtons.classList.remove('hidden');
            }
        }
        
        // Handle window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Slider controls
        function initControls() {
            const sliders = ['galaxySpeed', 'orbitRadius', 'orbitSpeed', 'spawnFreq'];
            
            sliders.forEach(param => {
                const slider = document.getElementById(param);
                const valueDisplay = document.getElementById(param + 'Value');
                
                // Set initial values from controls
                slider.value = controls[param];
                valueDisplay.textContent = controls[param];
                
                slider.addEventListener('input', (e) => {
                    const value = parseFloat(e.target.value);
                    controls[param] = value;
                    valueDisplay.textContent = value;
                    
                    // Save to localStorage immediately
                    localStorage.setItem(param, value);
                });
            });
        }
        
        // Video modal functionality
        function showVideo() {
            const videoModal = document.getElementById('videoModal');
            const tutorialIframe = document.getElementById('tutorialIframe');
            
            tutorialIframe.src = 'https://www.youtube.com/embed/nDsLsFpFoxI';
            videoModal.style.display = 'flex';
        }
        
        // Initialize video modal controls
        function initVideoModal() {
            const videoModal = document.getElementById('videoModal');
            const closeVideoModal = document.getElementById('closeVideoModal');
            const tutorialIframe = document.getElementById('tutorialIframe');
            
            closeVideoModal.addEventListener('click', () => {
                videoModal.style.display = 'none';
                tutorialIframe.src = ''; // Stop video playback
            });
            
            // Close modal when clicking outside
            videoModal.addEventListener('click', (e) => {
                if (e.target === videoModal) {
                    videoModal.style.display = 'none';
                    tutorialIframe.src = ''; // Stop video playback
                }
            });
            
            // Close modal with Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && videoModal.style.display === 'flex') {
                    videoModal.style.display = 'none';
                    tutorialIframe.src = ''; // Stop video playback
                }
            });
        }
        
        // Initialize
        window.addEventListener('resize', onWindowResize);
        initThree();
        initControls();
        initVideoModal();
        updateStatus();
    </script>
</body>
</html>
