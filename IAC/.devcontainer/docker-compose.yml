version: '3.8'
services:
  iac:
    image: openclone-iac:1.0
    container_name: openclone-iac
    build:
      context: ..
      dockerfile: ./Dockerfile
    volumes:
      - "${OpenClone_Root_Dir}/IAC:/workspaces/IAC" # this just emulates what the devcontainer does when you don't use a docker-compose.yml
      - "${OpenClone_Root_Dir}/Database/:/Database"